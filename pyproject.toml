[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-repro"
version = "0.1.0"
description = "Local pseudonymized CSV and Markdown fixtures for reproducible bug reports"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "ZhihaoW-star"}]
dependencies = []

[project.scripts]
csv-repro = "csv_repro:main"

[tool.setuptools]
py-modules = ["csv_repro"]
